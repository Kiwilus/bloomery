[package]
name = "bloomery"
version = "1.13.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kiwilus/bloomery.git"
readme = "README.md"
description = "A lightweight, minimalist build system for Java written in Rust."
keywords = ["Java", "build-system", "tool", "minimalist"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.5"
directories = "6.0.0"
owo-colors = "4.4.0"
serde_json = "1.0.151"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "blm"
path = "src/main.rs"
