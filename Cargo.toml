[package]
name = "blm"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kiwilus/bloomery.git"
keywords = ["Java", "build-system", "tool"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.4"

[[bin]]
name = "blm"
path = "src/main.rs"
